# Configuração do Auditor de Rede Portátil
# Local após a instalação: /etc/auditor-rede/config.ini

[auditor]
# Profundidade do escaneamento:
#   rapido   -> só portas abertas (mais veloz)
#   padrao   -> portas + identificação de serviços (recomendado)
#   completo -> 1000 portas + serviços (mais lento)
perfil = padrao

# Desligar o Pi sozinho ao terminar o escaneamento no boot (sim/nao).
# Teste primeiro com "nao". Para impedir o desligamento numa vez específica,
# crie um arquivo vazio chamado manter-ligado.txt na partição de boot do cartão SD.
desligar_ao_final = nao

# Quanto tempo esperar pela rede (em segundos) antes de desistir.
aguardar_rede_segundos = 90

# Onde salvar os relatórios (vazio = /var/lib/auditor-rede/relatorios).
pasta_saida =

# Pasta extra para receber uma cópia dos relatórios (ex.: pendrive ou HD já montado).
# Exemplo: /mnt/hd/relatorios-rede
pasta_copia =

# Tópico do ntfy.sh para receber um aviso no celular quando terminar (opcional).
# Só envia a contagem de dispositivos e alertas, sem detalhes da rede.
ntfy_topico =
